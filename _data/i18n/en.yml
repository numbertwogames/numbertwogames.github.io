support:
  title: Support
  intro: Need help with one of our games, found a bug or have an idea? We are happy to help.
  contact_heading: Contact us
  contact_text: Send us an email and we will get back to you as soon as possible, usually within a few working days.
  contact_tip: "Tip: tell us which game, which device and which version you are using. That helps us solve your problem faster."
  faq_heading: Frequently asked questions
  faq:
    - q: Do I need an internet connection to play?
      a: No. Our games play fully offline.
    - q: Do your games contain ads or in-app purchases?
      a: Ace31 has no ads and no in-app purchases. Any future changes for a game will be clearly shown on its store page.
    - q: Do I need an account?
      a: No. You can start playing right away. There are no accounts and no sign-ins.
    - q: How do I change the language?
      a: Ace31 follows the language of your device. It is available in English, Dutch, German, French and Spanish.
    - q: My progress or settings are gone. What happened?
      a: Settings are stored only on your device. Deleting the app removes them. We cannot restore them for you because we never receive your data.
    - q: I found a bug. How do I report it?
      a: Send us an email with a short description of what happened and, if possible, a screenshot. Please include your device model and the game version.

privacy:
  title: Privacy policy
  updated: "Last updated: 26 September 2026"
  intro: Number Two Games respects your privacy. This policy explains what information our games and this website handle. The short version is that we do not collect your personal data.
  sections:
    - title: Our games
      body: |
        Our games are designed to work without collecting personal data. They do not require an account, do not show ads and do not include analytics or tracking tools.

        Game settings and progress, such as your preferred sound volume or the tutorial status, are stored only on your own device. This data never leaves your device and we cannot access it. Deleting the game removes this data.
    - title: App stores
      body: |
        Our games are distributed through the Apple App Store and Google Play. When you download a game, Apple or Google may process information about you, such as your purchase and anonymous crash reports if you have enabled sharing with developers. This is handled under their own privacy policies. We may receive aggregated, anonymous statistics from these stores, such as the number of downloads per country.
    - title: This website
      body: |
        This website does not use cookies, analytics or tracking. It is hosted on GitHub Pages. GitHub may log technical information, such as your IP address, to keep the service secure and working. See the [GitHub privacy statement](https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement) for details.

        When you choose a language, your choice is saved in your browser's local storage so we can show the right language on your next visit. This information stays in your browser.
    - title: Email
      body: |
        If you contact us by email, we use your email address and message only to answer your question. We do not share them with others and we delete them when they are no longer needed.
    - title: Children
      body: |
        Our games are suitable for players of all ages. Because we do not collect personal data, we also do not knowingly collect data from children.
    - title: Your rights
      body: |
        Under privacy laws such as the GDPR you have the right to access, correct or delete personal data we hold about you. Because we only hold data you send us by email, you can simply contact us to use these rights.
    - title: Changes
      body: |
        We may update this policy when our games or this website change. The date at the top of this page shows when it was last updated.
  contact: Questions about privacy? Email us at

