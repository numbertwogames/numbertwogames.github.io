games_text:
  ace31:
    tagline: The classic 31 card game
    short: The classic card game 31 on your phone and tablet. Build the best three-card hand, go for 31 and outlast your AI opponents.
    release: October 2026
    description:
      - Ace31 brings the classic card game 31 to your iPhone, iPad and Android device. Build the strongest three-card hand of one suit, go for 31 and be the last player with coins left.
      - Rounds are short, the rules are easy to learn and a friendly tutorial gets you started in no time. No internet needed.
    how_to_play:
      - Each player gets 3 cards. The table shows 3 open cards and 1 hidden bonus card.
      - On your turn, swap a card, take all three open cards, or fold to lock in your hand.
      - "Add up the cards of one suit: aces count 11, face cards 10, the rest their number."
      - Hit 31 and the round ends at once. Three of a kind scores 30.5. Three aces beats everything.
      - The lowest score loses a coin. Run out and you get one last chance to keep swimming.
    features:
      - Play against 1 to 5 AI opponents that think and make mistakes like real players.
      - Short rounds that fit a coffee break.
      - An interactive tutorial teaches every rule step by step.
      - Bright, touch-friendly design made for landscape play.
      - Calm lounge music and satisfying card sounds.
      - Plays fully offline. No ads, no accounts, no data collection.
      - Available in English, Dutch, German, French and Spanish.
    screenshots:
      table: The game table during your turn
      tutorial: The interactive tutorial
      results: The results at the end of a round
      six-players: A game with six players
      menu: The main menu
