games_text:
  ace31:
    tagline: Das klassische Kartenspiel 31
    short: Der Kartenspielklassiker 31 auf deinem Smartphone und Tablet. Sammle die beste Hand aus drei Karten, spiel auf 31 und halte länger durch als deine KI-Gegner.
    release: Oktober 2026
    description:
      - Ace31 bringt den Kartenspielklassiker 31 (auch bekannt als Schwimmen oder Schnauz) auf dein iPhone, iPad und Android-Gerät. Sammle die stärkste Hand aus drei Karten einer Farbe, spiel auf 31 und sei der letzte Spieler mit Münzen.
      - Die Runden sind kurz, die Regeln schnell gelernt und ein freundliches Tutorial hilft dir beim Einstieg. Kein Internet nötig.
    how_to_play:
      - Jeder Spieler erhält 3 Karten. Auf dem Tisch liegen 3 offene Karten und 1 verdeckte Bonuskarte.
      - Tausche in deinem Zug eine Karte, nimm alle drei offenen Karten oder schiebe, um deine Hand festzulegen.
      - "Zähle die Karten einer Farbe zusammen: Asse zählen 11, Bilder 10, alle anderen ihren Wert."
      - Mit 31 endet die Runde sofort. Drei gleiche Karten zählen 30,5. Drei Asse schlagen alles.
      - Die niedrigste Punktzahl verliert eine Münze. Ohne Münzen darfst du noch einmal schwimmen.
    features:
      - Spiele gegen 1 bis 5 KI-Gegner, die wie echte Spieler überlegen und Fehler machen.
      - Kurze Runden für die Kaffeepause.
      - Ein interaktives Tutorial erklärt jede Regel Schritt für Schritt.
      - Farbenfrohes, touchfreundliches Design für das Querformat.
      - Entspannte Lounge-Musik und schöne Kartengeräusche.
      - Komplett offline spielbar. Keine Werbung, kein Konto, keine Datenerfassung.
      - Verfügbar auf Deutsch, Englisch, Niederländisch, Französisch und Spanisch.
    screenshots:
      table: Der Spieltisch während deines Zuges
      tutorial: Das interaktive Tutorial
      results: Das Ergebnis am Ende einer Runde
      six-players: Ein Spiel mit sechs Spielern
      menu: Das Hauptmenü
