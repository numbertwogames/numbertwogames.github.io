games_text:
  ace31:
    tagline: El clásico juego de cartas 31
    short: El clásico juego de cartas 31 en tu móvil y tableta. Consigue la mejor mano de tres cartas, busca el 31 y resiste más que tus rivales de IA.
    release: octubre de 2026
    description:
      - Ace31 lleva el clásico juego de cartas 31 a tu iPhone, iPad y dispositivo Android. Reúne la mejor mano de tres cartas del mismo palo, busca el 31 y sé el último jugador con monedas.
      - Las rondas son cortas, las reglas se aprenden rápido y un tutorial sencillo te pone a jugar en nada. Sin necesidad de internet.
    how_to_play:
      - Cada jugador recibe 3 cartas. En la mesa hay 3 cartas descubiertas y 1 carta extra oculta.
      - En tu turno, cambia una carta, llévate las tres cartas descubiertas o plántate para fijar tu mano.
      - "Suma las cartas de un mismo palo: el as vale 11, las figuras 10 y el resto su número."
      - Con 31 la ronda termina al instante. Un trío vale 30,5. Tres ases ganan a todo.
      - La puntuación más baja pierde una moneda. Sin monedas, tienes una última oportunidad para seguir nadando.
    features:
      - Juega contra 1 a 5 rivales de IA que piensan y se equivocan como jugadores reales.
      - Rondas cortas, perfectas para un descanso.
      - Un tutorial interactivo explica cada regla paso a paso.
      - Diseño colorido y táctil, pensado para jugar en horizontal.
      - Música lounge relajante y sonidos de cartas agradables.
      - Funciona sin conexión. Sin anuncios, sin cuentas y sin recopilación de datos.
      - Disponible en español, inglés, neerlandés, alemán y francés.
    screenshots:
      table: La mesa de juego durante tu turno
      tutorial: El tutorial interactivo
      results: Los resultados al final de una ronda
      six-players: Una partida con seis jugadores
      menu: El menú principal
