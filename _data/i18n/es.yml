support:
  title: Soporte
  intro: ¿Necesitas ayuda con alguno de nuestros juegos, has encontrado un error o tienes una idea? Estaremos encantados de ayudarte.
  contact_heading: Contacto
  contact_text: Envíanos un correo electrónico y te responderemos lo antes posible, normalmente en unos pocos días laborables.
  contact_tip: "Consejo: indícanos el juego, tu dispositivo y la versión que usas. Así podremos resolver tu problema más rápido."
  faq_heading: Preguntas frecuentes
  faq:
    - q: ¿Necesito conexión a internet para jugar?
      a: No. Nuestros juegos funcionan completamente sin conexión.
    - q: ¿Vuestros juegos tienen anuncios o compras dentro de la app?
      a: Ace31 no tiene anuncios ni compras dentro de la app. Cualquier cambio futuro se indicará claramente en la página del juego en la tienda.
    - q: ¿Necesito una cuenta?
      a: No. Puedes empezar a jugar enseguida. No hay cuentas ni inicios de sesión.
    - q: ¿Cómo cambio el idioma?
      a: Ace31 usa el idioma de tu dispositivo. El juego está disponible en español, inglés, neerlandés, alemán y francés.
    - q: Mi progreso o mis ajustes han desaparecido. ¿Qué ha pasado?
      a: Los ajustes se guardan solo en tu dispositivo. Si eliminas la app, también se eliminan. No podemos recuperarlos porque nunca recibimos tus datos.
    - q: He encontrado un error. ¿Cómo lo comunico?
      a: Envíanos un correo con una breve descripción de lo que ha pasado y, si es posible, una captura de pantalla. Indica también el modelo de tu dispositivo y la versión del juego.

privacy:
  title: Política de privacidad
  updated: "Última actualización: 26 de septiembre de 2026"
  intro: Number Two Games respeta tu privacidad. Esta política explica qué información tratan nuestros juegos y este sitio web. En resumen, no recopilamos tus datos personales.
  sections:
    - title: Nuestros juegos
      body: |
        Nuestros juegos están diseñados para funcionar sin recopilar datos personales. No requieren cuenta, no muestran anuncios y no incluyen herramientas de análisis ni de seguimiento.

        Los ajustes y el progreso, como el volumen del sonido o el estado del tutorial, se guardan solo en tu propio dispositivo. Estos datos nunca salen de tu dispositivo y no tenemos acceso a ellos. Al eliminar el juego, también se eliminan estos datos.
    - title: Tiendas de aplicaciones
      body: |
        Nuestros juegos se distribuyen a través de la App Store de Apple y Google Play. Cuando descargas un juego, Apple o Google pueden tratar información sobre ti, como tu compra e informes de fallos anónimos si has activado compartirlos con los desarrolladores. Esto se rige por sus propias políticas de privacidad. Podemos recibir de estas tiendas estadísticas anónimas y agregadas, como el número de descargas por país.
    - title: Este sitio web
      body: |
        Este sitio web no utiliza cookies, herramientas de análisis ni seguimiento. Está alojado en GitHub Pages. GitHub puede registrar información técnica, como tu dirección IP, para mantener el servicio seguro y en funcionamiento. Consulta la [declaración de privacidad de GitHub](https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement) para más información.

        Cuando eliges un idioma, tu elección se guarda en el almacenamiento local de tu navegador para mostrarte el idioma correcto en tu próxima visita. Esta información se queda en tu navegador.
    - title: Correo electrónico
      body: |
        Si nos escribes por correo electrónico, usamos tu dirección y tu mensaje solo para responder a tu pregunta. No los compartimos con nadie y los eliminamos cuando ya no son necesarios.
    - title: Menores
      body: |
        Nuestros juegos son aptos para jugadores de todas las edades. Como no recopilamos datos personales, tampoco recopilamos a sabiendas datos de menores.
    - title: Tus derechos
      body: |
        Según las leyes de protección de datos, como el RGPD, tienes derecho a acceder, rectificar o suprimir los datos personales que tengamos sobre ti. Como solo tenemos los datos que nos envías por correo electrónico, basta con que te pongas en contacto con nosotros para ejercer estos derechos.
    - title: Cambios
      body: |
        Podemos actualizar esta política cuando cambien nuestros juegos o este sitio web. La fecha que aparece al principio de esta página indica cuándo se actualizó por última vez.
  contact: ¿Tienes preguntas sobre privacidad? Escríbenos a

