games_text:
  ace31:
    tagline: Le jeu de cartes classique 31
    short: Le jeu de cartes classique du 31 sur votre téléphone et votre tablette. Formez la meilleure main de trois cartes, visez 31 et survivez à vos adversaires IA.
    release: octobre 2026
    description:
      - Ace31 apporte le jeu de cartes classique du 31 sur votre iPhone, votre iPad et votre appareil Android. Formez la meilleure main de trois cartes d'une même couleur, visez 31 et soyez le dernier joueur à garder des jetons.
      - Les manches sont courtes, les règles s'apprennent vite et un tutoriel accueillant vous lance en un rien de temps. Aucune connexion requise.
    how_to_play:
      - Chaque joueur reçoit 3 cartes. La table présente 3 cartes visibles et 1 carte bonus cachée.
      - À votre tour, échangez une carte, prenez les trois cartes visibles ou passez pour figer votre main.
      - "Additionnez les cartes d'une même couleur : l'as vaut 11, les figures 10, les autres leur valeur."
      - Avec 31, la manche s'arrête aussitôt. Un brelan vaut 30,5. Trois as battent tout.
      - Le score le plus bas perd un jeton. Sans jeton, vous avez une dernière chance de rester en jeu.
    features:
      - Affrontez de 1 à 5 adversaires IA qui réfléchissent et se trompent comme de vrais joueurs.
      - Des manches courtes, idéales pour une pause.
      - Un tutoriel interactif explique chaque règle pas à pas.
      - Un design coloré, pensé pour le tactile et le mode paysage.
      - Une musique lounge apaisante et des sons de cartes agréables.
      - Fonctionne entièrement hors ligne. Sans publicité, sans compte, sans collecte de données.
      - Disponible en français, anglais, néerlandais, allemand et espagnol.
    screenshots:
      table: La table de jeu pendant votre tour
      tutorial: Le tutoriel interactif
      results: Les résultats à la fin d'une manche
      six-players: Une partie à six joueurs
      menu: Le menu principal
