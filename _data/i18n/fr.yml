support:
  title: Assistance
  intro: "Bloqué ? Un bug à signaler ? Une idée de génie sur le trône ? Nous sommes là pour vous aider."
  contact_heading: "Écrivez-nous"
  contact_text: Envoyez-nous un e-mail et nous vous répondrons dès que possible, généralement sous quelques jours ouvrés.
  contact_tip: "Astuce : indiquez-nous le jeu, votre appareil et la version utilisée. Cela nous aide à résoudre votre problème plus rapidement."
  discord_heading: "Rejoignez-nous sur Discord"
  discord_text: "Discutez avec l’équipe et d’autres joueurs, partagez vos retours et soyez les premiers informés de nos nouveaux jeux."
  discord_button: "Rejoindre notre Discord"
  faq_heading: Questions fréquentes
  faq:
    - q: Ai-je besoin d'une connexion internet pour jouer ?
      a: Non. Nos jeux fonctionnent entièrement hors ligne.
    - q: Vos jeux contiennent-ils des publicités ou des achats intégrés ?
      a: Ace31 ne contient ni publicité ni achats intégrés. Tout changement futur sera clairement indiqué sur la page du jeu dans la boutique.
    - q: Ai-je besoin d'un compte ?
      a: Non. Vous pouvez commencer à jouer immédiatement. Il n'y a ni compte ni connexion.
    - q: Comment changer la langue ?
      a: Ace31 utilise la langue de votre appareil. Le jeu est disponible en français, anglais, néerlandais, allemand et espagnol.
    - q: Ma progression ou mes réglages ont disparu. Que s'est-il passé ?
      a: Les réglages sont enregistrés uniquement sur votre appareil. Supprimer l'application les supprime aussi. Nous ne pouvons pas les restaurer, car nous ne recevons jamais vos données.
    - q: J'ai trouvé un bug. Comment le signaler ?
      a: Envoyez-nous un e-mail avec une courte description de ce qui s'est passé et, si possible, une capture d'écran. Indiquez aussi votre modèle d'appareil et la version du jeu.

privacy:
  title: Politique de confidentialité
  updated: "Dernière mise à jour : 26 septembre 2026"
  intro: Number Two Games respecte votre vie privée. Cette politique explique quelles informations nos jeux et ce site web traitent. En résumé, nous ne collectons pas vos données personnelles.
  sections:
    - title: Nos jeux
      body: |
        Nos jeux sont conçus pour fonctionner sans collecter de données personnelles. Ils ne nécessitent pas de compte, n'affichent pas de publicité et n'intègrent aucun outil d'analyse ou de suivi.

        Les réglages et la progression, comme le volume sonore ou l'état du tutoriel, sont enregistrés uniquement sur votre appareil. Ces données ne quittent jamais votre appareil et nous n'y avons pas accès. Supprimer le jeu supprime également ces données.
    - title: Boutiques d'applications
      body: |
        Nos jeux sont distribués via l'App Store d'Apple et Google Play. Lorsque vous téléchargez un jeu, Apple ou Google peuvent traiter des informations vous concernant, comme votre achat et des rapports de plantage anonymes si vous avez activé le partage avec les développeurs. Ces traitements relèvent de leurs propres politiques de confidentialité. Nous pouvons recevoir de ces boutiques des statistiques anonymes et agrégées, comme le nombre de téléchargements par pays.
    - title: Ce site web
      body: |
        Ce site web n'utilise ni cookies, ni outils d'analyse, ni suivi. Il est hébergé sur GitHub Pages. GitHub peut enregistrer des informations techniques, comme votre adresse IP, afin d'assurer la sécurité et le bon fonctionnement du service. Consultez la [déclaration de confidentialité de GitHub](https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement) pour en savoir plus.

        Lorsque vous choisissez une langue, votre choix est enregistré dans le stockage local de votre navigateur afin d'afficher la bonne langue lors de votre prochaine visite. Cette information reste dans votre navigateur.
    - title: E-mail
      body: |
        Si vous nous contactez par e-mail, nous utilisons votre adresse et votre message uniquement pour répondre à votre question. Nous ne les partageons avec personne et les supprimons lorsqu'ils ne sont plus nécessaires.
    - title: Enfants
      body: |
        Nos jeux conviennent aux joueurs de tous âges. Comme nous ne collectons pas de données personnelles, nous ne collectons pas non plus sciemment de données concernant des enfants.
    - title: Vos droits
      body: |
        En vertu des lois sur la protection des données, comme le RGPD, vous avez le droit d'accéder aux données personnelles que nous détenons sur vous, de les rectifier ou de les supprimer. Comme nous ne détenons que les données que vous nous envoyez par e-mail, il vous suffit de nous contacter pour exercer ces droits.
    - title: Modifications
      body: |
        Nous pouvons mettre à jour cette politique lorsque nos jeux ou ce site web évoluent. La date en haut de cette page indique la dernière mise à jour.
  contact: Des questions sur la confidentialité ? Écrivez-nous à

