games_text:
  ace31:
    tagline: Het klassieke kaartspel 31-en
    short: Het klassieke kaartspel 31-en op je telefoon en tablet. Maak de beste hand van drie kaarten, ga voor 31 en overleef je computertegenstanders.
    release: oktober 2026
    description:
      - Ace31 brengt het klassieke kaartspel 31-en naar je iPhone, iPad en Android-apparaat. Verzamel de sterkste hand van drie kaarten in één kleur, ga voor 31 en wees de laatste speler met munten.
      - De rondes zijn kort, de regels leer je snel en een duidelijke uitleg helpt je meteen op weg. Geen internet nodig.
    how_to_play:
      - Iedere speler krijgt 3 kaarten. Op tafel liggen 3 open kaarten en 1 verborgen bonuskaart.
      - Ruil in je beurt een kaart, pak alle drie de open kaarten of pas om je hand vast te zetten.
      - "Tel de kaarten van één kleur op: azen tellen 11, plaatjes 10 en de rest hun getal."
      - Heb je 31, dan eindigt de ronde meteen. Drie dezelfde kaarten scoren 30,5. Drie azen verslaan alles.
      - De laagste score verliest een munt. Ben je door je munten heen, dan mag je nog één keer zwemmen.
    features:
      - Speel tegen 1 tot 5 computertegenstanders die nadenken en fouten maken zoals echte spelers.
      - Korte rondes, perfect voor tussendoor.
      - Een interactieve uitleg leert je stap voor stap alle regels.
      - Vrolijk ontwerp, gemaakt voor aanraking en liggend spelen.
      - Rustige loungemuziek en fijne kaartgeluiden.
      - Volledig offline. Geen advertenties, geen account, geen gegevensverzameling.
      - Beschikbaar in het Nederlands, Engels, Duits, Frans en Spaans.
    screenshots:
      table: De speltafel tijdens jouw beurt
      tutorial: De interactieve uitleg
      results: De uitslag aan het einde van een ronde
      six-players: Een spel met zes spelers
      menu: Het hoofdmenu
