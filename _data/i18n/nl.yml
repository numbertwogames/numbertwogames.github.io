support:
  title: Support
  intro: "Vastgelopen? Een bug gevonden? Een briljant idee gekregen op de pot? We helpen je graag."
  contact_heading: "Laat iets van je horen"
  contact_text: Stuur ons een e-mail en we reageren zo snel mogelijk, meestal binnen een paar werkdagen.
  contact_tip: "Tip: vertel ons om welke game, welk apparaat en welke versie het gaat. Zo kunnen we je sneller helpen."
  faq_heading: Veelgestelde vragen
  faq:
    - q: Heb ik een internetverbinding nodig om te spelen?
      a: Nee. Onze games werken volledig offline.
    - q: Bevatten jullie games advertenties of in-app aankopen?
      a: Ace31 heeft geen advertenties en geen in-app aankopen. Eventuele toekomstige wijzigingen worden altijd duidelijk vermeld op de pagina in de store.
    - q: Heb ik een account nodig?
      a: Nee. Je kunt meteen beginnen met spelen. Er zijn geen accounts en je hoeft nergens in te loggen.
    - q: Hoe verander ik de taal?
      a: Ace31 volgt de taal van je apparaat. De game is beschikbaar in het Nederlands, Engels, Duits, Frans en Spaans.
    - q: Mijn voortgang of instellingen zijn weg. Wat is er gebeurd?
      a: Instellingen worden alleen op je apparaat bewaard. Als je de app verwijdert, worden ze ook verwijderd. We kunnen ze niet herstellen, omdat we je gegevens nooit ontvangen.
    - q: Ik heb een fout gevonden. Hoe meld ik die?
      a: Stuur ons een e-mail met een korte beschrijving van wat er gebeurde en, als het kan, een screenshot. Vermeld ook je apparaat en de versie van de game.

privacy:
  title: Privacybeleid
  updated: "Laatst bijgewerkt: 26 september 2026"
  intro: Number Two Games respecteert je privacy. Dit beleid legt uit welke informatie onze games en deze website verwerken. Kort gezegd verzamelen we geen persoonsgegevens.
  sections:
    - title: Onze games
      body: |
        Onze games werken zonder persoonsgegevens te verzamelen. Je hebt geen account nodig, er zijn geen advertenties en er zitten geen analyse- of trackingtools in.

        Instellingen en voortgang, zoals het geluidsvolume of de status van de uitleg, worden alleen op je eigen apparaat bewaard. Deze gegevens verlaten je apparaat nooit en wij hebben er geen toegang toe. Als je de game verwijdert, worden deze gegevens ook verwijderd.
    - title: App stores
      body: |
        Onze games worden verspreid via de Apple App Store en Google Play. Wanneer je een game downloadt, kunnen Apple of Google gegevens over je verwerken, zoals je aankoop en anonieme crashrapporten als je delen met ontwikkelaars hebt ingeschakeld. Dit valt onder hun eigen privacybeleid. We kunnen van deze stores geanonimiseerde statistieken ontvangen, zoals het aantal downloads per land.
    - title: Deze website
      body: |
        Deze website gebruikt geen cookies, analysetools of tracking. De website wordt gehost op GitHub Pages. GitHub kan technische gegevens vastleggen, zoals je IP-adres, om de dienst veilig en werkend te houden. Zie de [privacyverklaring van GitHub](https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement) voor meer informatie.

        Als je een taal kiest, wordt je keuze opgeslagen in de lokale opslag van je browser, zodat we bij je volgende bezoek de juiste taal tonen. Deze informatie blijft in je browser.
    - title: E-mail
      body: |
        Als je ons een e-mail stuurt, gebruiken we je e-mailadres en bericht alleen om je vraag te beantwoorden. We delen ze niet met anderen en verwijderen ze wanneer ze niet meer nodig zijn.
    - title: Kinderen
      body: |
        Onze games zijn geschikt voor spelers van alle leeftijden. Omdat we geen persoonsgegevens verzamelen, verzamelen we ook niet bewust gegevens van kinderen.
    - title: Je rechten
      body: |
        Op grond van privacywetgeving zoals de AVG heb je het recht om persoonsgegevens die we over je hebben in te zien, te laten corrigeren of te laten verwijderen. Omdat we alleen gegevens hebben die je ons per e-mail stuurt, kun je hiervoor eenvoudig contact met ons opnemen.
    - title: Wijzigingen
      body: |
        We kunnen dit beleid aanpassen wanneer onze games of deze website veranderen. De datum bovenaan deze pagina laat zien wanneer het voor het laatst is bijgewerkt.
  contact: Vragen over privacy? Mail ons op

